<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note taking App</title>
    <link rel="stylesheet" href="/index.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand">Note taking App</h1>
    </header>
    <main>
      <div class="workspace">
        <aside>
          <form id="note-form">
            <div class="composer-heading">
              <h2 id="form-heading">Create a Note</h2>
            </div>
            <label for="title">Title<span class="required">*</span></label>
            <input
              id="title"
              name="title"
              type="text"
              maxlength="100"
              placeholder="Give it a title..."
              required
            />
            <label for="content"
              >Your note<span class="required">*</span></label
            >
            <div class="form-actions">
              <textarea
                name="content"
                id="content"
                rows="8"
                maxlength="5000"
                placeholder="Write a description"
                required
              ></textarea>
              <button id="save-button" type="submit" class="primary-button">
                Add note
              </button>

              <button
                id="cancel-button"
                class="cancel-button"
                type="button"
                hidden
              >
                Cancel edit
              </button>
            </div>
          </form>
        </aside>
        <section class="collection">
          <div class="collection-heading">
            <h1 id="collection-heading">Your notes</h1>
          </div>
          <section class="toolbar">
            <div class="search-field">
              <label class="visually-hidden" for="search"
                >Search title or content</label
              >
              <input
                type="search"
                id="search"
                placeholder="Search your notes..."
              />
            </div>
            <div class="filter-fields">
              <div>
                <label for="filter" class="visually-hidden">Show notes</label>
                <select id="filter">
                  <option value="all">All notes</option>
                  <option value="pinned">Pinned notes</option>
                </select>
              </div>
              <div>
                <label for="sort" class="visually-hidden">Sort notes</label>
                <select id="sort">
                  <option value="updated">Recently updated</option>
                  <option value="title">Title A-z</option>
                </select>
              </div>
            </div>
          </section>
          <div class="collection-meta">
            <p id="stats"></p>
          </div>
          <p id="message" role="status"></p>
          <section id="note-list"></section>
        </section>
      </div>
    </main>
    <template id="note-template">
      <article class="note-card">
        <div class="card-top">
          <span class="card-label">Note</span>
          <span class="pin-badge">PINNED</span>
        </div>
        <h3 class="note-title"></h3>
        <p class="note-content"></p>
        <div class="card-footer">
          <small class="note-date"></small>
          <div class="actions" role="group">
            <button type="button" data-action="edit">Edit</button>
            <button type="button" data-action="pin">Pin</button>
            <button type="button" data-action="delete">Delete</button>
          </div>
        </div>
      </article>
    </template>
  </body>
</html>
